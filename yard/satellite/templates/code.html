<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Rover Code</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/yard-base.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            background-color: var(--background);
            color: var(--foreground);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 44px;
            border: none;
            border-radius: 14px;
            font-size: 32px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-run {
            background: var(--ok);
            color: var(--background);
        }

        .btn-run:hover {
            filter: brightness(0.95);
        }

        .btn-stop {
            background: var(--bad);
            color: var(--background);
        }

        .btn-stop:hover {
            filter: brightness(0.95);
        }

        .btn-clear {
            background: var(--surface-3);
            color: var(--foreground);
        }

        .btn-clear:hover {
            background: var(--surface-2);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 22px;
            border-radius: 28px;
            font-size: 22px;
            color: var(--text-faint);
            background: rgba(255,255,255,0.08);
        }

        .status-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--border);
            transition: background-color 200ms var(--ease-out);
        }

        .status-dot.connected {
            background: var(--ok);
        }

        .status-dot.spy {
            background: var(--warn);
        }

        /* Tab bar */
        .tab-bar {
            display: flex;
            background: var(--surface-2);
            border-bottom: 2px solid var(--border);
        }

        .tab-btn {
            padding: 18px 48px;
            border: none;
            background: transparent;
            color: var(--text-faint);
            font-size: 26px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 4px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s;
        }

        .tab-btn.active {
            color: var(--foreground);
            border-bottom-color: var(--ok);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text);
        }

        /* Panes */
        .pane {
            display: none;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .pane.active {
            display: flex;
            flex-direction: column;
        }

        /* Blockly */
        .blockly-container {
            flex: 1;
            position: relative;
        }

        #blocklyDiv {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Python editor */
        .python-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .python-fallback-note {
            margin: 0 0 6px;
            font-size: 12px;
            color: var(--text-dim, #9aa0a8);
        }

        .python-fallback {
            width: 100%;
            height: calc(100% - 24px);
            resize: none;
            border: 1px solid var(--border, #333);
            border-radius: 8px;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 10px;
            tab-size: 4;
        }

        #pythonEditor {
            flex: 1;
        }

        /* Spy output panel */
        .spy-panel {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 200px;
            background: var(--surface);
            border-top: 2px solid var(--warn);
            overflow-y: auto;
            z-index: 100;
        }

        .spy-panel.visible {
            display: block;
        }

        .spy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--warn);
            color: var(--background);
            font-weight: 600;
            font-size: 12px;
        }

        .spy-close {
            cursor: pointer;
            padding: 2px 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
        }

        .spy-content {
            padding: 8px 12px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text);
        }

        .spy-content div {
            padding: 2px 0;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 44px;
            background: var(--surface-3);
            color: var(--foreground);
            border-radius: 14px;
            font-size: 26px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.visible {
            opacity: 1;
        }

        .toast.success {
            background: var(--ok);
        }

        .toast.error {
            background: var(--bad);
        }
    </style>
    <!-- Served locally, not from a CDN: the satellite runs on mobile data at a
         venue and /code/ has to load when that drops. See
         mission-control/scripts/vendor-blockly.mjs. -->
    <script src="/static/vendor/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/monaco-editor@0.52.0/min/vs/loader.js"></script>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="toolbar-left">
                <a class="yard-home" href="/" title="Back to the console" aria-label="Back to the console"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
                <button class="btn btn-run" id="runBtn">Run</button>
                <button class="btn btn-stop" id="stopBtn">Stop</button>
                <button class="btn btn-clear" id="clearBtn">Clear</button>
                <button class="btn btn-clear" id="importBtn">Import</button>
            </div>
            <div class="toolbar-right">
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" id="tabBlockly">Blockly</button>
            <button class="tab-btn" id="tabPython">Python</button>
        </div>

        <!-- Blockly pane -->
        <div class="pane active" id="paneBlockly">
            <div class="blockly-container">
                <div id="blocklyDiv"></div>
                <div class="spy-panel" id="spyPanel">
                    <div class="spy-header">
                        <span>Spy Mode - Commands Preview</span>
                        <span class="spy-close" id="spyClose">Close</span>
                    </div>
                    <div class="spy-content" id="spyOutput"></div>
                </div>
            </div>
        </div>

        <!-- Python editor pane -->
        <div class="pane" id="panePython">
            <div class="python-container">
                <div id="pythonEditor"></div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <!-- A module, so it can import the block definitions rather than carry a
         second copy of them. Safe because this page has no inline event
         handlers: nothing here needs to be global. Blockly and the Monaco AMD
         loader are classic scripts above, so both are on window by the time
         this deferred module runs. -->
    <script type="module" src="/static/pages/code.js"></script>
</body>
</html>
