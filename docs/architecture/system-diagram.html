<title>Mission Control Architecture</title>
<style>
  :root {
    --paper: #FAF7F2;
    --ink: #1A1D21;
    --node: #F3EFE7;
    --ext: #F1ECE2;
    --line: #C9C2B4;
    --muted: #6E6A60;
    --indigo: #3B4CCA;
    --teal: #0E7C7B;
    --forest: #2F6B3A;
    --slate: #475569;
    --green: #2F8F46;
    --amber-bg: #F3E3BB;
    --amber-ink: #7A5A17;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12100E;
      --ink: #F2EFE9;
      --node: #1C1915;
      --ext: #181510;
      --line: #45403A;
      --muted: #A39D91;
      --indigo: #8D99F0;
      --teal: #41B9B6;
      --forest: #7CC48A;
      --slate: #97A5BB;
      --green: #63C078;
      --amber-bg: #35290F;
      --amber-ink: #E8C56A;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12100E;
    --ink: #F2EFE9;
    --node: #1C1915;
    --ext: #181510;
    --line: #45403A;
    --muted: #A39D91;
    --indigo: #8D99F0;
    --teal: #41B9B6;
    --forest: #7CC48A;
    --slate: #97A5BB;
    --green: #63C078;
    --amber-bg: #35290F;
    --amber-ink: #E8C56A;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-block: 24px;
    padding-inline: 16px;
    margin: 0;
  }
  .frame { max-width: 100%; overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 1150px; height: auto; }

  text { fill: var(--ink); }
  .title  { font-size: 26px; font-weight: 650; }
  .stamp  { font-size: 12px; fill: var(--muted); }
  .band   { font-size: 19px; font-weight: 700; letter-spacing: 1.5px; }
  .bandsub{ font-size: 12px; font-weight: 600; fill: var(--muted); letter-spacing: .4px; }
  .ntitle { font-size: 15px; font-weight: 600; }
  .nsub   { font-size: 12px; fill: var(--muted); }
  .body   { font-size: 12px; }
  .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .monosb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
  .lbl    { font-size: 11px; paint-order: stroke; stroke: var(--paper); stroke-width: 6px; stroke-linejoin: round; }
  .lblsb  { font-size: 12px; font-weight: 650; paint-order: stroke; stroke: var(--paper); stroke-width: 6px; stroke-linejoin: round; }
  .rulelbl{ font-size: 13px; font-weight: 700; letter-spacing: 1px; paint-order: stroke; stroke: var(--paper); stroke-width: 8px; stroke-linejoin: round; }
  .cap    { font-size: 11px; fill: var(--muted); }

  .node   { fill: var(--node); stroke: var(--ink); stroke-width: 1.4; }
  .paperfill { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
  .extnode{ fill: var(--ext); stroke: var(--line); stroke-width: 1.2; }
  .row    { fill: var(--paper); stroke: var(--line); stroke-width: 1; }
  .focus  { fill: var(--node); stroke: var(--ink); stroke-width: 2.4; }

  .sync   { stroke: var(--ink); stroke-width: 2; fill: none; }
  .syncbig{ stroke: var(--ink); stroke-width: 3; fill: none; }
  .bg     { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
  .stream-o { stroke: var(--ink); stroke-width: 4.6; fill: none; }
  .stream-i { stroke: var(--paper); stroke-width: 2.2; fill: none; }
  .actuate{ stroke: var(--green); stroke-width: 4; fill: none; }
  .ah     { fill: var(--ink); }
  .ahg    { fill: var(--green); }
  .inherit{ fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
  .icon   { stroke: var(--ink); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
<div class="frame">

  <text class="body" x="1216" y="878">mast camera, ultrasonic</text>
