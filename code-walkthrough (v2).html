<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control — INF4027W Code Walkthrough</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2430; --border:#2b3442;
    --ink:#e6edf3; --muted:#8b98a9; --accent:#4ea1ff; --accent2:#7ee787;
    --code-bg:#0b0f16;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;height:100vh;overflow:hidden}

  /* Sidebar */
  aside{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
  .brand{padding:18px 20px 12px;border-bottom:1px solid var(--border)}
  .brand h1{font-size:15px;margin:0 0 3px;letter-spacing:.2px}
  .brand p{margin:0;color:var(--muted);font-size:12px}
  .scoreline{display:flex;align-items:baseline;gap:8px;margin-top:10px}
  .scoreline b{font-size:26px;color:var(--accent2)}
  .scoreline span{color:var(--muted);font-size:12px}
  nav{overflow-y:auto;flex:1;padding:8px 0}
  .navitem{display:flex;gap:10px;align-items:flex-start;padding:9px 18px;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
  .navitem:hover{background:var(--panel2)}
  .navitem.active{background:var(--panel2);border-left-color:var(--accent)}
  .navnum{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px;min-width:18px}
  .navtitle{flex:1;font-size:13.5px}
  .navmark{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}

  /* Main */
  main{flex:1;overflow-y:auto;padding:34px 46px 80px}
  .crumb{color:var(--muted);font-size:12px;letter-spacing:.5px;text-transform:uppercase}
  h2{font-size:26px;margin:6px 0 4px}
  .marks{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:12px;color:var(--accent2);margin-left:4px;vertical-align:middle}
  .lead{color:var(--muted);max-width:760px;margin:8px 0 22px}

  .block{margin:0 0 26px;max-width:900px}
  .label{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .label svg{width:14px;height:14px}

  figure{margin:0 0 14px}
  figcaption{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--panel);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  figcaption a{color:var(--accent);text-decoration:none}
  figcaption a:hover{text-decoration:underline}
  figcaption .open{color:var(--muted);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;opacity:.75;white-space:nowrap}
  figcaption.plain{color:var(--muted)}
  pre{margin:0;background:var(--code-bg);border:1px solid var(--border);border-radius:0 0 8px 8px;padding:14px 16px;overflow-x:auto}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5;color:#cdd9e5;white-space:pre}
  .c-key{color:#ff7b72} .c-str{color:#a5d6ff} .c-com{color:#8b949e;font-style:italic} .c-fn{color:#d2a8ff} .c-type{color:#7ee787}

  .files{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .files .label{color:var(--accent)}
  .files ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
  @media(max-width:1100px){.files ul{grid-template-columns:1fr}}
  .files li a{color:var(--ink);text-decoration:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;display:flex;align-items:center;gap:8px;padding:3px 0}
  .files li a:hover{color:var(--accent)}
  .files li a svg{width:13px;height:13px;color:var(--muted);flex-shrink:0}

  .why{max-width:820px}

  .footer-nav{position:fixed;bottom:0;left:340px;right:0;background:rgba(13,17,23,.92);backdrop-filter:blur(6px);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:10px 46px}
  .btn{background:var(--panel2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.35;cursor:default}
  .kbd{color:var(--muted);font-size:11px}
  .kbd b{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:ui-monospace,monospace}

  .rubric{display:inline-block;background:rgba(78,161,255,.12);border:1px solid rgba(78,161,255,.35);color:var(--accent);border-radius:20px;padding:3px 12px;font-size:11px;letter-spacing:.3px;margin-left:4px;vertical-align:middle}
  .stackgroup{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:0 0 12px}
  .stackgroup h4{margin:0 0 12px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .logos{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .logo{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;min-width:190px;flex:1 1 190px}
  .logo svg{width:22px;height:22px;flex-shrink:0}
  .logo .lname{font-size:12.5px;font-weight:600;line-height:1.25}
  .logo .lnote{font-size:11px;color:var(--muted);line-height:1.3}
  .stackgroup .gwhy{font-size:13.5px;color:#c9d5e2;border-top:1px solid var(--border);padding-top:11px;margin:0}
  .stackgroup .gwhy code{background:var(--code-bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11.5px;color:#a5d6ff}
  .tradeoffs{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .trow{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:12px 16px;border-bottom:1px solid var(--border)}
  .trow:last-child{border-bottom:none}
  .trow .tk{font-size:12px;font-weight:600;color:var(--accent2)}
  .trow .tv{font-size:13.5px;color:#c9d5e2}
  @media(max-width:900px){.trow{grid-template-columns:1fr;gap:4px}}
  .why code{background:var(--code-bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11.5px;color:#a5d6ff}
  .why em{color:var(--accent2);font-style:normal;font-weight:600}
  .gwhy em{color:var(--accent2);font-style:normal;font-weight:600}
  .tag{display:inline-block;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:0 6px 6px 0}
</style>
</head>

<script>
function getCurrentRepoRoot(){
  const href = window.location && window.location.href ? window.location.href : '';
  if (!href) return '';

  const raw = decodeURIComponent(href.replace(/^file:\/\//i, ''));
  const normalized = raw.replace(/\\/g, '/');

  if (!normalized || !normalized.includes('/')) return '';

  const parts = normalized.split('/');
  parts.pop();
  return parts.join('/');
}

function vscodeUrl(rel){
  const repoRoot = getCurrentRepoRoot();
  const cleanRel = String(rel || '').replace(/^\/+/, '');

  if (!repoRoot) return cleanRel;

  if (/^[A-Za-z]:\//.test(repoRoot)) {
    return 'vscode://file/' + repoRoot.replace(/\\/g, '/').replace(/\/+$/, '') + '/' + cleanRel;
  }

  return 'vscode://file' + repoRoot + '/' + cleanRel;
}

function hl(code){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const kws = ['class','def','return','if','else','try','except','import','from','async',
               'await','const','let','interface','export','function','implements','extends',
               'abstract','new','this','public','private','readonly','type','enum','Promise',
               'void','string','boolean','number','match','allow','resource','request'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b','g');
  const plain = s => esc(s).replace(kwRe,'<span class="c-key">$1</span>');

  // Comments first in the alternation, then strings. Whichever begins earlier
  // in the source wins, which is what stops "don't" inside a comment from
  // opening a string.
  const re = /(#[^\n]*|\/\/[^\n]*)|('[^'\n]*'|"[^"\n]*"|`[^`\n]*`)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code)) !== null) {
    out += plain(code.slice(last, m.index));
    out += m[1]
      ? '<span class="c-com">' + esc(m[1]) + '</span>'
      : '<span class="c-str">' + esc(m[2]) + '</span>';
    last = re.lastIndex;
  }
  return out + plain(code.slice(last));
}

const STROKE_ONLY = ["blockly", "monaco", "sse"];
const CRITERIA = [
 {
  "id": 1,
  "title": "The stack",
  "rubric": "Technology used \u00b7 appropriateness",
  "lead": "Chosen for one audience and one venue: children on borrowed devices, and a science centre with unreliable wifi and a Raspberry Pi Zero at the end of the wire. Grouped by the job each tool does.",
  "stack": [
   {
    "group": "Learner web app",
    "items": [
     {
      "slug": "typescript",
      "label": "TypeScript 5",
      "note": "Types across four boundaries"
     },
     {
      "slug": "react",
      "label": "React 19",
      "note": "Two live views of one program"
     },
     {
      "slug": "nextdotjs",
      "label": "Next.js 16",
      "note": "One deploy unit, pages + API"
     }
    ],
    "why": "TypeScript over plain JavaScript because a mission changes shape four times on its way through the system: browser form to API route to Firestore document to operator console. A renamed field is a compile error here, not an <code>undefined</code> discovered by a child mid-demo. It deliberately does <em>not</em> cover data arriving off the network, which is why Zod guards the API boundary. The two are complementary, not redundant: TypeScript for code we wrote, Zod for data we were handed. React because the authoring screen is two live views of the same program (blocks and simulation) and its component model keeps them in step without hand-written DOM syncing. Next.js because the App Router puts pages and API in one process, so there is one container to build and one Cloud Run service to pay for and secure. For a four-person team, that is the difference between shipping and operating."
   },
   {
    "group": "Authoring surface",
    "items": [
     {
      "slug": "blockly",
      "label": "Blockly",
      "note": "Drag-and-drop for beginners"
     },
     {
      "slug": "monaco",
      "label": "Monaco",
      "note": "The editor VS Code uses"
     }
    ],
    "why": "Two editors over one, because our users span a nine-year-old who has never typed a semicolon and a Grade 11 learner who wants real Python. Blockly generates the same program Monaco shows, so the step up is a toggle rather than a new tool to learn. Monaco specifically because it is the VS Code editor: what a learner practises here transfers to the editor they will use next."
   },
   {
    "group": "Yard services (on the Pi)",
    "items": [
     {
      "slug": "python",
      "label": "Python 3",
      "note": "The rover library is Python"
     },
     {
      "slug": "flask",
      "label": "Flask",
      "note": "Small enough for a Pi Zero"
     },
     {
      "slug": "raspberrypi",
      "label": "Raspberry Pi",
      "note": "Satellite + rover hardware"
     }
    ],
    "why": "Python is not a preference here, it is a constraint: 4tronix ship the M.A.R.S. rover library in Python, so any other language means running a bridge process on a Pi Zero that is already driving motors and a camera. Flask over Django or FastAPI because the satellite shares a single-core Pi with a camera stream, and a heavier framework spends memory we need for frames. The whole satellite is a handful of modules with no ORM and no app server."
   },
   {
    "group": "Data & platform",
    "items": [
     {
      "slug": "firebase",
      "label": "Firestore",
      "note": "Store and queue in one"
     },
     {
      "slug": "sqlite",
      "label": "SQLite",
      "note": "The offline mirror"
     },
     {
      "slug": "googlecloud",
      "label": "Cloud Run",
      "note": "Scales to zero"
     },
     {
      "slug": "terraform",
      "label": "Terraform",
      "note": "Reproducible infrastructure"
     },
     {
      "slug": "githubactions",
      "label": "GitHub Actions",
      "note": "Test then deploy"
     }
    ],
    "why": "Firestore doubles as the mission queue, which removes an entire message broker from the architecture, and its free tier suits a non-profit. SQLite on the satellite because it is a file, not a server: nothing extra to run on the Pi, real transactions for the mission lease, and it is the single reason the operator console keeps working when the venue internet drops. Cloud Run because it scales to zero, so an idle platform costs nothing between school visits. Terraform because when the deployment had to move projects, it was a variable change rather than a rebuild."
   },
   {
    "group": "Outbound services",
    "items": [

  why:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12" y2="17"/></svg>',
  files:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
};

let current = 0;

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = CRITERIA.map((c,i)=>`
    <div class="navitem ${i===current?'active':''}" data-i="${i}">
      <span class="navnum">${c.id}</span>
      <span class="navtitle">${c.title}<br><span style="color:var(--muted);font-size:11px">${c.rubric}</span></span>
    </div>`).join('');
  nav.querySelectorAll('.navitem').forEach(el=>{
    el.onclick=()=>{current=+el.dataset.i;render();};
  });
}

function logoSVG(slug){
  const l = LOGOS[slug];
  if(!l) return '';
  const stroke = STROKE_ONLY.indexOf(slug) !== -1;
  return stroke
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="#${l.hex}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${l.path}"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="#${l.hex}"><path d="${l.path}"/></svg>`;
}

function stackHTML(groups){
  return groups.map(g=>`
    <div class="stackgroup">
      <h4>${g.group}</h4>
      <div class="logos">
        ${g.items.map(it=>`<div class="logo">${logoSVG(it.slug)}<div><div class="lname">${it.label}</div><div class="lnote">${it.note}</div></div></div>`).join('')}
      </div>
      <p class="gwhy">${g.why}</p>
    </div>`).join('');
}

function tradeoffsHTML(rows){
  return `<div class="block"><div class="label">${ICONS.why} Practicality · cost · scale</div>
    <div class="tradeoffs">${rows.map(r=>`<div class="trow"><div class="tk">${r[0]}</div><div class="tv">${r[1]}</div></div>`).join('')}</div></div>`;
}

function evidenceHTML(ev){
  return ev.map(e=>{
    const cap = e.path
      ? `<figcaption><a href="${vscodeUrl(e.path)}">${e.file}</a><span class="open">Open in VS Code \u2197</span></figcaption>`
      : `<figcaption class="plain">${e.file}</figcaption>`;
    return `<figure>${cap}<pre><code>${hl(e.code)}</code></pre></figure>`;
  }).join('');
}

function filesHTML(files){
  return `<div class="block files"><div class="label">${ICONS.files} Relevant files \u2014 click to open in VS Code</div>
    <ul>${files.map(f=>`<li><a href="${vscodeUrl(f.path)}">${ICONS.file}${f.label}</a></li>`).join('')}</ul></div>`;
}

function render(){
  const c = CRITERIA[current];
  document.getElementById('main').innerHTML = `
    <div class="crumb">${c.id} of ${CRITERIA.length}</div>
    <h2>${c.title} <span class="rubric">${c.rubric}</span></h2>
    <p class="lead">${c.lead}</p>

    ${c.stack ? `<div class="block">${stackHTML(c.stack)}</div>` : ''}
    ${c.evidence ? `<div class="block">${evidenceHTML(c.evidence)}</div>` : ''}
    ${c.tradeoffs ? tradeoffsHTML(c.tradeoffs) : ''}

    <div class="block"><div class="label">${ICONS.why} Why we did it this way</div><div class="why">${c.why}</div></div>

    ${c.files ? filesHTML(c.files) : ''}
  `;
  renderNav();
  document.getElementById('prev').disabled = current===0;
  document.getElementById('next').disabled = current===CRITERIA.length-1;
  document.getElementById('main').scrollTop = 0;
}

document.getElementById('prev').onclick=()=>{if(current>0){current--;render();}};
document.getElementById('next').onclick=()=>{if(current<CRITERIA.length-1){current++;render();}};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='A') return;
  if(e.key==='ArrowRight'&&current<CRITERIA.length-1){current++;render();}
  if(e.key==='ArrowLeft'&&current>0){current--;render();}
});

render();
</script>
