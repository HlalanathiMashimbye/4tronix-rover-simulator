<script>
function getCurrentRepoRoot(){
  const href = window.location && window.location.href ? window.location.href : '';
  if (!href) return '';

  const raw = decodeURIComponent(href.replace(/^file:\/\//i, ''));
  const normalized = raw.replace(/\\/g, '/');

  if (!normalized || !normalized.includes('/')) return '';

  const parts = normalized.split('/');
  parts.pop();
  return parts.join('/');
}

function vscodeUrl(rel){
  const repoRoot = getCurrentRepoRoot();
  const cleanRel = String(rel || '').replace(/^\/+/, '');

  if (!repoRoot) return cleanRel;

  if (/^[A-Za-z]:\//.test(repoRoot)) {
    return 'vscode://file/' + repoRoot.replace(/\\/g, '/').replace(/\/+$/, '') + '/' + cleanRel;
  }

  return 'vscode://file' + repoRoot + '/' + cleanRel;
}

/* ---- crude syntax highlight ---- */
function hl(code){
  let s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/(#.*)$/gm,'<span class="c-com">$1</span>');
  s = s.replace(/(\/\/.*)$/gm,'<span class="c-com">$1</span>');
  s = s.replace(/('[^'\n]*'|"[^"\n]*"|`[^`\n]*`)/g,'<span class="c-str">$1</span>');
  const kws=['class','def','return','if','else','try','except','import','from','async','await','const','let','interface','export','function','implements','extends','abstract','new','this','public','private','readonly','type','enum','Promise','void','string','boolean','number'];
  s = s.replace(new RegExp('\\b('+kws.join('|')+')\\b','g'),'<span class="c-key">$1</span>');
  return s;
}

export async function hashLearnerId(learnerId: string): Promise<string> {

  return Array.from(new Uint8Array(digest))

const ICONS = {
  why:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12" y2="17"/></svg>',
  files:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
};

let current = 0;

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = CRITERIA.map((c,i)=>`
    <div class="navitem ${i===current?'active':''}" data-i="${i}">
      <span class="navnum">${c.id}</span>
      <span class="navtitle">${c.title}</span>
    </div>`).join('');
  nav.querySelectorAll('.navitem').forEach(el=>{
    el.onclick=()=>{current=+el.dataset.i;render();};
  });
}

function evidenceHTML(ev){
  return ev.map(e=>{
    const cap = e.path
      ? `<figcaption><a href="${vscodeUrl(e.path)}">${e.file}</a><span class="open">Open in VS Code ↗</span></figcaption>`
      : `<figcaption class="plain">${e.file}</figcaption>`;
    return `<figure>${cap}<pre><code>${hl(e.code)}</code></pre></figure>`;
  }).join('');
}

function filesHTML(files){
  return `<div class="block files"><div class="label">${ICONS.files} Relevant files — click to open in VS Code</div>
    <ul>${files.map(f=>`<li><a href="${vscodeUrl(f.path)}">${ICONS.file}${f.label}</a></li>`).join('')}</ul></div>`;
}

function render(){
  const c = CRITERIA[current];
  document.getElementById('main').innerHTML = `
    <div class="crumb">${c.id} of 12</div>
    <h2>${c.title}</h2>
    <p class="lead">${c.lead}</p>
    <div style="margin-bottom:20px">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>

    <div class="block">${evidenceHTML(c.evidence)}</div>

    <div class="block"><div class="why">${c.why}</div></div>

    ${c.files ? filesHTML(c.files) : ''}
  `;
  renderNav();
  document.getElementById('prev').disabled = current===0;
  document.getElementById('next').disabled = current===CRITERIA.length-1;
  document.getElementById('main').scrollTop = 0;
}

document.getElementById('prev').onclick=()=>{if(current>0){current--;render();}};
document.getElementById('next').onclick=()=>{if(current<CRITERIA.length-1){current++;render();}};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='A') return;
  if(e.key==='ArrowRight'&&current<CRITERIA.length-1){current++;render();}
  if(e.key==='ArrowLeft'&&current>0){current--;render();}
});

render();
</script>
